name: Mirror website docs to Wiki

on:
  schedule:
    # GitHub Actions schedules use UTC. Runs daily at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-docs-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror website docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies and generate API docs
        working-directory: website
        run: |
          npm ci
          npm run gen

      - name: Mirror docs into the wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WIKI_TOKEN:-}" ]; then
            echo "Missing WIKI_TOKEN secret. Add a token with write access to the repository wiki."
            exit 1
          fi

          wiki_dir="${RUNNER_TEMP}/phoenix-wiki"
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/havaianasdestruido/FNF-Phoenix-Engine.wiki.git" "$wiki_dir"

          # Keep the mirror in its own subtree so existing hand-written wiki pages survive.
          mkdir -p "$wiki_dir/Website-Docs"
          rsync -a --delete website/docs/ "$wiki_dir/Website-Docs/"

          cd "$wiki_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Website-Docs
          if git diff --cached --quiet; then
            echo "Wiki docs are already up to date."
          else
            git commit -m "Mirror website docs"
            git push origin HEAD
          fi
