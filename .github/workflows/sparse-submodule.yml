name: Sparse Submodule (fnf_030_ui)

# Clones the mods/psych-scripts submodule (inky03/psych-scripts) with a
# sparse checkout, so ONLY its fnf_030_ui/ folder is checked out -- the
# rest of that repo (charter/, lua_reference/, pacman/, screens/ and the
# upstream root files) is never cloned into the working tree.
#
# Why not `actions/checkout` with `submodules: true` or a plain
# `git submodule update --init`? Both check out the submodule's full
# working tree before anything can intervene. Cloning by hand with
# `--sparse --no-checkout` lets us set the sparse patterns first, so
# only fnf_030_ui/ is ever written to disk (its blobs are also the only
# ones fetched, thanks to `--filter=blob:none`).
#
# mods/fnf_030_ui is a symlink to psych-scripts/fnf_030_ui, so once this
# workflow finishes the engine sees a normal top-level mod with
# pack.json at mods/fnf_030_ui/pack.json.

on:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "mods/psych-scripts"
      - "mods/fnf_030_ui"
      - ".github/workflows/sparse-submodule.yml"
  pull_request:
    branches: [main]
    paths:
      - ".gitmodules"
      - "mods/psych-scripts"
      - "mods/fnf_030_ui"
      - ".github/workflows/sparse-submodule.yml"
  workflow_dispatch:
  # Lets other workflows (e.g. Build) reuse this clone step as a job.
  workflow_call:

permissions:
  contents: read

jobs:
  sparse-submodule:
    name: Clone fnf_030_ui (sparse)
    runs-on: ubuntu-latest
    steps:
      # Deliberately no submodules here: checkout must not clone
      # psych-scripts in full before the sparse clone below runs.
      - name: Checkout (without submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Clone psych-scripts submodule (sparse, fnf_030_ui only)
        id: clone-submodule
        env:
          SUBMODULE_PATH: mods/psych-scripts
        run: |
          set -euo pipefail

          # The commit the parent repo pins for this submodule, and the
          # URL declared in .gitmodules (never hardcoded, so a future
          # .gitmodules change is picked up automatically).
          pinned="$(git ls-tree HEAD "$SUBMODULE_PATH" | awk '{print $3}')"
          if [ -z "$pinned" ]; then
            echo "::error::$SUBMODULE_PATH is not a gitlink in HEAD; is it still a submodule?"
            exit 1
          fi
          url="$(git config -f .gitmodules "submodule.$SUBMODULE_PATH.url")"
          echo "Submodule: $SUBMODULE_PATH"
          echo "URL:       $url"
          echo "Pinned:    $pinned"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

          git submodule init "$SUBMODULE_PATH"

          # --sparse --no-checkout: clone the history without writing
          # any files yet. actions/checkout leaves $SUBMODULE_PATH as an
          # empty directory, which `git clone` accepts as a target.
          if [ ! -e "$SUBMODULE_PATH/.git" ]; then
            git clone --filter=blob:none --sparse --no-checkout "$url" "$SUBMODULE_PATH"
          fi

          # Restrict the working tree to the one folder we want, then
          # check out the exact commit the parent repo pins.
          git -C "$SUBMODULE_PATH" sparse-checkout set --no-cone '/fnf_030_ui/**'
          git -C "$SUBMODULE_PATH" checkout "$pinned"

          # Give the clone the standard submodule layout (.git/modules/…)
          # so `git submodule status` and friends work as usual.
          git submodule absorbgitdirs "$SUBMODULE_PATH"

      - name: Verify only fnf_030_ui was checked out
        env:
          SUBMODULE_PATH: mods/psych-scripts
          PINNED: ${{ steps.clone-submodule.outputs.pinned }}
        run: |
          set -euo pipefail

          echo "Sparse patterns:"
          git -C "$SUBMODULE_PATH" sparse-checkout list

          # The mod is present, at the pinned commit, through both the
          # real path and the top-level mods/fnf_030_ui symlink.
          test -f "$SUBMODULE_PATH/fnf_030_ui/pack.json"
          test -f "mods/fnf_030_ui/pack.json"
          test "$(git -C "$SUBMODULE_PATH" rev-parse HEAD)" = "$PINNED"

          # Nothing else from the upstream repo made it to disk.
          for folder in charter lua_reference pacman screens; do
            if [ -e "$SUBMODULE_PATH/$folder" ]; then
              echo "::error::$SUBMODULE_PATH/$folder was checked out; sparse checkout is not working."
              exit 1
            fi
          done

          # Sparse checkout must not leave the submodule dirty.
          git submodule status
          test -z "$(git -C "$SUBMODULE_PATH" status --porcelain)"

          echo "Checked out contents of $SUBMODULE_PATH:"
          ls -A "$SUBMODULE_PATH"
          du -sh "$SUBMODULE_PATH"

      # The point of the exercise: hand the cloned mod to whatever runs
      # next (or to a human, from the workflow run page).
      - name: Upload fnf_030_ui mod
        uses: actions/upload-artifact@v4
        with:
          name: fnf_030_ui
          path: mods/psych-scripts/fnf_030_ui/
          if-no-files-found: error
          retention-days: 7
