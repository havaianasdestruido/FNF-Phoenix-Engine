name: Documentation

# Builds the Docusaurus site in `website/` and publishes it to GitHub Pages.
# The Haxe code reference and the Lua/Python API pages are regenerated from
# `source/` during the build (see website/scripts/), so a doc comment change in
# the engine is enough to update the published site.

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "source/**"
      - "project.hxp"
      - "hmm.json"
      - "setup/unix.sh"
      - "README.md"
      - "BUILDING.md"
      - "CODESTYLE.md"
      - "URI.MD"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - "source/**"
      - "project.hxp"
      - "hmm.json"
      - "setup/unix.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege by default: only the deploy job gets the Pages write scope.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site and browser game
    runs-on: ubuntu-latest
    env:
      HAXE_VERSION: "4.3.7"
      HAXELIB_PATH: ${{ github.workspace }}/.haxelib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub Pages serves the game under a project subpath. Build the actual
      # HTML5 target here (with a small, playable Tutorial/Week 1 content set),
      # then stage Lime's generated files into Docusaurus' static output.
      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Restore Haxelib dependencies
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HAXELIB_PATH }}
          key: docs-haxelib-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json', 'setup/unix.sh') }}

      - name: Install Haxelib dependencies
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          haxelib setup "$HAXELIB_PATH"
          chmod +x ./setup/unix.sh
          SKIP_SYSTEM_DEPENDENCIES=1 ./setup/unix.sh

      - name: Configure Haxelib
        if: steps.haxelib-cache.outputs.cache-hit == 'true'
        run: haxelib setup "$HAXELIB_PATH"

      - name: Build HTML5 game
        run: haxelib run lime build html5 -DNO_BUILTIN_CONTENT -DMODDING_LEVEL=0

      - name: Stage HTML5 game for GitHub Pages
        working-directory: website
        run: npm run stage:game

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # Catches content that builds fine but renders wrong (e.g. the legacy
      # `:::note Title` admonition syntax, which CommonMark shows as plain text).
      - name: Check markdown syntax
        working-directory: website
        run: npm run lint:docs

      - name: Build (regenerates the code reference)
        working-directory: website
        run: npm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Needs `pages: write`, hence it lives here and not in the build job.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
