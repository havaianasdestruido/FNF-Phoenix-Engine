name: Debug build

# TEMPORARY workflow used to surface the failing compile output as annotations
# (artifact/log downloads are unavailable in this environment).

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  HAXE_VERSION: "4.3.7"
  HAXELIB_PATH: ${{ github.workspace }}/.haxelib
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache

jobs:
  debug:
    name: Debug ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-24.04
            target: android
            setup: android
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973

      - name: Restore haxelib
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HAXELIB_PATH }}
          key: haxelib-${{ runner.os }}-${{ matrix.setup }}-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json') }}

      - name: Configure Android
        shell: bash
        run: |
          android_sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          haxelib run lime config ANDROID_SDK "$android_sdk"
          haxelib run lime config ANDROID_NDK_ROOT "$android_sdk/ndk/27.0.12077973"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Compile (Android, verbose)
        shell: bash
        run: |
          set +e
          rm -rf "$HXCPP_COMPILE_CACHE" 2>/dev/null || true
          haxelib run lime build ${{ matrix.target }} -verbose > /tmp/build.log 2>&1
          code=$?
          echo "exit code: $code"
          echo "=== tail of build log ==="
          tail -n 200 /tmp/build.log

          # Emit the log tail as annotations, which are readable over the
          # (allowed) api.github.com host.
          emit() {
            local title="$1"
            local body="$2"
            body=${body//%/%25}
            body=${body//$'\r'/}
            body=${body//$'\n'/%0A}
            echo "::error title=${title}::${body:0:20000}"
          }

          emit "haxe error context" "$(grep -aB 2 -A 12 'ERROR' /tmp/build.log | tail -n 60)"
          emit "last 30 lines" "$(tail -n 30 /tmp/build.log)"

          exit $code
