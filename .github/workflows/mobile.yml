name: Mobile

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      buildAndroid:
        description: "Build Android"
        required: false
        type: boolean
        default: true

      buildIOS:
        description: "Build iOS"
        required: false
        type: boolean
        default: false

      buildAllTargets:
        description: "Build all mobile targets"
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string
        default: ""

      buildAndroid:
        description: "Build Android"
        required: false
        type: boolean
        default: true

      buildIOS:
        description: "Build iOS"
        required: false
        type: boolean
        default: false

      buildAllTargets:
        description: "Build all mobile targets"
        required: false
        type: boolean
        default: false


jobs:
  Mobile:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-24.04
            target: android

          - os: macos-latest
            target: ios

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Check whether this target is enabled
      # ==========================================
      - name: Check target selection
        id: target-selection
        shell: bash
        run: |
          BUILD_ANDROID="${{ inputs.buildAndroid }}"
          BUILD_IOS="${{ inputs.buildIOS }}"
          BUILD_ALL="${{ inputs.buildAllTargets }}"

          # Push events don't have workflow_dispatch inputs.
          # Default to Android for normal pushes.
          if [ "${{ github.event_name }}" = "push" ]; then
            BUILD_ANDROID="true"
            BUILD_IOS="false"
            BUILD_ALL="false"
          fi

          if [ "$BUILD_ALL" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "All mobile targets enabled."
            exit 0
          fi

          case "${{ matrix.target }}" in
            android)
              ENABLED="$BUILD_ANDROID"
              ;;
            ios)
              ENABLED="$BUILD_IOS"
              ;;
            *)
              ENABLED="false"
              ;;
          esac

          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

          if [ "$ENABLED" = "true" ]; then
            echo "Target ${{ matrix.target }} is enabled."
          else
            echo "Target ${{ matrix.target }} is disabled."
          fi


      # ==========================================
      # Setup Haxe
      # ==========================================
      - name: Setup Haxe
        if: steps.target-selection.outputs.enabled == 'true'
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6


      # ==========================================
      # Setup Java 17
      # ==========================================
      - name: Setup Java 17
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # Setup Android SDK & NDK
      # ==========================================
      - name: Setup Android SDK & NDK
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-33 build-tools;33.0.2 ndk;27.0.12077973


      # ==========================================
      # Ensure haxelib
      # ==========================================
      - name: Ensure haxelib and show diagnostics
        if: steps.target-selection.outputs.enabled == 'true'
        shell: bash
        run: |
          set -eux

          echo "PATH=$PATH"

          haxe --version || true

          if ! command -v haxelib >/dev/null 2>&1; then
            echo "ERROR: haxelib not found in PATH"
            exit 1
          fi

          haxelib --version || true

          haxelib selfupdate || true


      # ==========================================
      # Install Haxe libraries
      # ==========================================
      - name: Install Haxe libraries
        if: steps.target-selection.outputs.enabled == 'true'
        shell: bash
        run: |
          set -eux

          haxelib install hscript || true
          haxelib install hmm || true
          haxelib install lime || true

          haxelib run hmm install --quiet || true


      # ==========================================
      # Configure Android
      # ==========================================
      - name: Configure Android
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          set -eux

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          haxelib run lime config ANDROID_SDK "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          haxelib run lime config ANDROID_NDK_ROOT \
            "${ANDROID_NDK_ROOT:-${ANDROID_HOME}/ndk/27.0.12077973}"

          haxelib run lime config JAVA_HOME "$JAVA_HOME"

          haxelib run lime config ANDROID_SETUP true


      # ==========================================
      # Compile Android
      # ==========================================
      - name: Compile (Android)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          set -eux

          if [ -n "${{ inputs.buildFlags }}" ]; then
            haxelib run lime build android \
              -D "${{ inputs.buildFlags }}"
          else
            haxelib run lime build android
          fi


      # ==========================================
      # Compile iOS
      # ==========================================
      - name: Compile (iOS)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'ios'
        shell: bash
        run: |
          set -eux

          if [ -n "${{ inputs.buildFlags }}" ]; then
            haxelib run lime build ios \
              -nosign \
              -D "${{ inputs.buildFlags }}"
          else
            haxelib run lime build ios -nosign
          fi


      # ==========================================
      # Make IPA
      # ==========================================
      - name: Make IPA
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'ios'
        shell: bash
        run: |
          set -eux

          brew install ldid

          cd build/release/ios/build/Release-iphoneos/FNF-Phoenix-Engine.app

          ldid \
            -S../../../FNF-Phoenix-Engine/FNF-Phoenix-Engine.entitlements \
            FNF-Phoenix-Engine || true

          cd ..

          mkdir -p Payload

          mv FNF-Phoenix-Engine.app Payload

          zip -r FNF-Phoenix-Engine.ipa Payload


      # ==========================================
      # Upload Android artifact
      # ==========================================
      - name: Upload Artifact (Android)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          # `FNF-Phoenix-Engine-debug.apk`: this lime fork only runs Gradle
          # `assembleRelease` when a keystore is configured, and CI has none.
          path: build/release/android/bin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # ==========================================
      # Upload iOS artifact
      # ==========================================
      - name: Upload Artifact (iOS)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: iOSBuild
          path: |
            FNF-Phoenix-Engine.ipa
            build/release/ios/build/Release-iphoneos/*.ipa
          if-no-files-found: error
