name: Checks

# Fast regression guards: dependency manifests, the JNI bridge contract,
# host-JVM Android bridge/policy classes, standalone native C/C++ smoke tests,
# and an hxcpp native-object-cache smoke test. None of these need a full game
# build or the Android SDK. Most isolated Haxe interpreter specs in tests/haxe/
# are not run here; the diagnostic log, crash bundle, diagnostics report and
# phoenix:// URI parser specs have a dedicated Haxe job below.

on:
  push:
    branches: [main, bleeding]
  pull_request:
    branches: [main, bleeding]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dependency manifests agree and are pinned
        run: python3 tools/check_dependencies.py

      - name: JNI bridge contract matches the Java methods
        run: python3 tools/check_android_bridge.py --check

      - name: Setup Java 17 for host-JVM regression tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run host-JVM Android bridge/policy tests
        run: bash tests/java/run.sh

      - name: Run native C/C++ smoke tests
        run: bash tests/native/run.sh

      # Static guard for main.yml's cache keys: they must be reused, not
      # re-created per commit, and every native header must stay a declared
      # hxcpp dependency. No Haxe or C++ toolchain needed.
      - name: Build cache keys roll over instead of piling up
        run: bash tests/haxe/run-build-cache-policy.sh
  diagnostic-report-specs:
    name: Diagnostic log, crash bundle and diagnostics page (Haxe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: "4.3.7"
      - name: Test diagnostic log redaction and retention
        run: bash tests/haxe/run-log-utils.sh
      - name: Test crash bundle archive safety
        run: bash tests/haxe/run-crash-bundle.sh
      - name: Test diagnostics report text and the phoenix://diagnostics page
        run: bash tests/haxe/run-diagnostics-report.sh
      - name: Test platform gating tags, option filters and pack.json requirements
        run: bash tests/haxe/run-platform-support.sh
      - name: Test render folder creation and FFmpeg lookup
        run: bash tests/haxe/run-video-render.sh
      - name: Test the phoenix:// URI parser and its route allowlists
        run: bash tests/uri/run.sh

  lua-script-pipeline:
    name: Lua script pipeline (Haxe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: "4.3.7"
      # Stage 0-2 (+5) are dependency free and always run.
      - name: Test mod discovery, the ModSecurity gate and loader invariants
        run: bash tests/haxe/run-lua-discovery.sh
      # The interpreter half runs the shipped mod scripts through the real
      # sandbox bootstrap. LuaJIT is the runtime hxluajit binds.
      - name: Build LuaJIT for the sandbox execution tests
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/LuaJIT/LuaJIT.git "$RUNNER_TEMP/luajit"
          make -C "$RUNNER_TEMP/luajit" -j"$(nproc)" >/dev/null
          echo "LUAJIT=$RUNNER_TEMP/luajit/src/luajit" >> "$GITHUB_ENV"
      - name: Execute the shipped Lua mods under the sandbox
        run: bash tests/haxe/run-lua-discovery.sh

  native-object-cache:
    name: hxcpp cache smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: "4.3.7"
      - name: Install the project's pinned hxcpp
        shell: bash
        run: |
          set -euo pipefail
          # $PWD is a native bash path on both Linux and Git Bash for Windows.
          libroot="$PWD/.hxcpp-test-libs"
          mkdir -p "$libroot"
          haxelib setup "$libroot"
          url=$(python -c "import json; print(next(d['url'] for d in json.load(open('hmm.json'))['dependencies'] if d['name']=='hxcpp'))")
          ref=$(python -c "import json; print(next(d['ref'] for d in json.load(open('hmm.json'))['dependencies'] if d['name']=='hxcpp'))")
          haxelib git hxcpp "$url" "$ref" --quiet
          hxcpp_dir="$libroot/hxcpp/git"
          (cd "$hxcpp_dir/tools/run" && haxe compile.hxml)
          (cd "$hxcpp_dir/tools/hxcpp" && haxe compile.hxml)
      - name: Verify cold, warm, header-change and flag-change builds
        shell: bash
        env:
          PHOENIX_RUN_HXCPP_CACHE_TESTS: "1"
        run: bash tests/haxe/run-hxcpp-cache.sh
      - name: Install Lime and HXP for the project configuration test
        shell: bash
        run: |
          set -euo pipefail
          url=$(python -c "import json; print(next(d['url'] for d in json.load(open('hmm.json'))['dependencies'] if d['name']=='lime'))")
          ref=$(python -c "import json; print(next(d['ref'] for d in json.load(open('hmm.json'))['dependencies'] if d['name']=='lime'))")
          haxelib git lime "$url" "$ref" --quiet
          haxelib install hxp --quiet
      - name: Verify project cache defaults and overrides
        shell: bash
        run: bash tests/haxe/run-project-build-cache.sh
      - name: Verify Android permission policy
        shell: bash
        run: bash tests/haxe/run-android-permission-policy.sh
      - name: Verify PowerShell test launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/haxe/run-project-build-cache.ps1
      - name: Verify batch test launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call tests\haxe\run-project-build-cache.bat

