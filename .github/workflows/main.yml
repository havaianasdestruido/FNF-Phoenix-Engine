name: Build

# CI builds and tests only the two supported platforms: Windows and Android.
# Other Lime targets remain buildable locally (see BUILDING.md), but they are
# not part of the GitHub Actions matrix.

on:
  push:
    branches: [main, bleeding]

  pull_request:
    branches: [main, bleeding]

  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string
        default: ""

      buildWindows:
        description: "Build Windows"
        required: false
        type: boolean
        default: true

      buildAndroid:
        description: "Build Android"
        required: false
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      buildWindows:
        description: "Build Windows"
        required: false
        type: boolean
        default: true

      buildAndroid:
        description: "Build Android"
        required: false
        type: boolean
        default: true

# Keep the haxelib installation inside the workspace so it can be restored on
# subsequent runs instead of downloading and compiling dependencies every time.
env:
  # Single source of truth for the compiler version (#60), including reusable
  # builds. The regression tests assert that this version stays pinned.
  HAXE_VERSION: "4.3.7"
  HAXELIB_PATH: ${{ github.workspace }}/.haxelib

  # hxcpp hashes C++ sources, declared headers, flags and compiler version.
  # Keep this outside build/ so it survives a clean and can be restored by CI.
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
  # Two Android ABIs and Windows PCH/object files can exceed hxcpp's 1 GB
  # default, in which case hxcpp evicts entries mid-build and the cache that
  # gets saved is already gutted.
  HXCPP_CACHE_MB: "2048"

  # Actions caches are immutable and every entry is a full snapshot of the
  # path it was saved from. Saving one cache per commit (or per PR) therefore
  # stores the same objects over and over until the 10 GB quota evicts
  # everything. Both shared caches (haxelib + native objects) are instead
  # written to one rolling key per target and refreshed only when its content
  # fingerprint changes, so a warm run reuses what the previous run saved.
  # Bump the version to invalidate every existing entry at once.
  CACHE_SCHEMA: v3

# Cancel previous runs for the same branch/PR concurrency:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # =========================
          # Windows
          # =========================
          - name: Windows
            os: windows-latest
            target: windows
            target_dir: windows
            cache_name: windows
            artifact: windowsBuild
            artifact_path: build/release/windows/bin
            setup: windows

          # =========================
          # Android
          # =========================
          - name: Android
            os: ubuntu-24.04
            target: android
            target_dir: android
            cache_name: android
            artifact: androidBuild
            # This lime fork runs Gradle `assembleRelease` only when a keystore is
            # configured (see lime's AndroidHelper). CI has no keystore, so the APK
            # lands in the `debug` flavor folder even though the build config is
            # release (output dir is still build/release/...).
            artifact_path: build/release/android/bin/app/build/outputs/apk/debug
            setup: android

    steps:
      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # Determine whether this target is enabled
      # ==========================================
      - name: Check target selection
        id: target-selection
        shell: bash
        run: |
          BUILD_WINDOWS="${{ inputs.buildWindows }}"
          BUILD_ANDROID="${{ inputs.buildAndroid }}"

          # Push / pull_request events don't provide workflow_dispatch inputs.
          # For those events, always build the two CI targets: Windows + Android.
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            BUILD_WINDOWS="true"
            BUILD_ANDROID="true"
          fi

          case "${{ matrix.target }}" in
            windows)
              ENABLED="$BUILD_WINDOWS"
              ;;
            android)
              ENABLED="$BUILD_ANDROID"
              ;;
            *)
              ENABLED="false"
              ;;
          esac

          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

          if [ "$ENABLED" = "true" ]; then
            echo "Target ${{ matrix.name }} is enabled."
          else
            echo "Target ${{ matrix.name }} is disabled."
          fi

      # ==========================================
      # Skip step for non-selected targets
      # ==========================================
      - name: Skip ${{ matrix.name }} (not selected)
        if: steps.target-selection.outputs.enabled != 'true'
        run: echo "⊘ Skipped (target not selected for this build)"
        continue-on-error: true

      # ==========================================
      # Haxe
      # ==========================================
      - uses: krdlab/setup-haxe@master
        if: steps.target-selection.outputs.enabled == 'true'
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      # ==========================================
      # Java 17 - Android
      # ==========================================
      # No `cache: gradle` here on purpose. setup-java's Gradle cache is
      # keyed on a hash of a Gradle project that Lime only generates during
      # the build, so the first run has nothing to hash and every PR saved a
      # 512 MB copy (~3 GB of the quota, re-uploaded on each PR). The Gradle
      # dependency cache is restored from the same rolling, per-target key as
      # the native objects below, on a path that survives the generated
      # project being re-created.
      - name: Setup Java 17
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Gradle user home
        id: gradle-home
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: echo "dir=${GRADLE_USER_HOME:-$HOME/.gradle}" >> "$GITHUB_OUTPUT"

      # ==========================================
      # Android SDK / NDK
      # ==========================================
      - name: Setup Android SDK & NDK
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973

      # ==========================================
      # Restore the Gradle dependency cache - Android
      # ==========================================
      # Same key material as the native object cache below (target, pinned
      # dependency set, build flags), so this is one rolling entry per target
      # instead of one 512 MB snapshot per PR.
      - name: Restore Gradle cache
        id: gradle-cache
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.gradle-home.outputs.dir }}/caches
          key: ${{ env.CACHE_SCHEMA }}-gradle-${{ matrix.cache_name }}-${{ runner.os }}-${{ hashFiles('hmm.json', 'setup/unix.sh', 'source/android/media3/build.gradle') }}-${{ inputs.buildFlags != '' && format('explicit-{0}', inputs.buildFlags) || 'unset' }}
          restore-keys: |
            ${{ env.CACHE_SCHEMA }}-gradle-${{ matrix.cache_name }}-${{ runner.os }}-${{ hashFiles('hmm.json', 'setup/unix.sh', 'source/android/media3/build.gradle') }}-

      # ==========================================
      # Restore Haxelib cache
      # ==========================================
      # `cache-hit` is only 'true' on an exact key match, so a cache found
      # through a restore-key is restored but still counts as a miss. Without
      # a hash of the lookup in the key, every commit produced a brand-new
      # haxelib entry. The key is now derived from the content instead (same
      # rolling scheme as the native object cache below).
      - name: Restore haxelib and hxcpp tools
        id: haxelib-cache
        if: steps.target-selection.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HAXELIB_PATH }}
          key: ${{ env.CACHE_SCHEMA }}-haxelib-${{ matrix.setup }}-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json', 'setup/unix.sh', 'setup/windows.bat', 'setup/windows-msvc-fix.ps1') }}
          restore-keys: |
            ${{ env.CACHE_SCHEMA }}-haxelib-${{ matrix.setup }}-haxe-${{ env.HAXE_VERSION }}-

      # ==========================================
      # Install Haxelib dependencies - Android
      # ==========================================
      - name: Install haxelib dependencies (Android)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'android' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          haxelib setup "$HAXELIB_PATH"
          chmod +x ./setup/unix.sh
          SKIP_SYSTEM_DEPENDENCIES=1 ./setup/unix.sh

      # ==========================================
      # Install Haxelib dependencies - Windows
      # ==========================================
      - name: Install haxelib dependencies (Windows)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'windows' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          haxelib setup "%HAXELIB_PATH%"
          call setup\windows.bat

      # ==========================================
      # Android configuration
      # ==========================================
      - name: Configure Android
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          android_sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$android_sdk"

          haxelib run lime config ANDROID_SDK "$android_sdk"
          haxelib run lime config ANDROID_NDK_ROOT "$android_sdk/ndk/27.0.12077973"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      # ==========================================
      # Windows MSVC fix
      # ==========================================
      - name: Ensure MSVC hxcpp git checkout (Windows)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File setup\windows-msvc-fix.ps1

      # ==========================================
      # Compile hxcpp tools - Android
      # ==========================================
      - name: Compile hxcpp tools (Android)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'android' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "$HAXELIB_PATH/hxcpp/git/tools/run"
          haxe compile.hxml

          cd "$HAXELIB_PATH/hxcpp/git/tools/hxcpp"
          haxe compile.hxml

      # ==========================================
      # Compile hxcpp tools - Windows
      # ==========================================
      - name: Compile hxcpp tools (Windows)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'windows' && steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "%HAXELIB_PATH%\hxcpp\git\tools\run"
          haxe compile.hxml

          cd /d "%HAXELIB_PATH%\hxcpp\git\tools\hxcpp"
          haxe compile.hxml

      # ==========================================
      # Report resolved dependency revisions (#57)
      # ==========================================
      - name: Report resolved dependency revisions
        if: steps.target-selection.outputs.enabled == 'true'
        shell: bash
        run: |
          for checkout in "$HAXELIB_PATH"/*/git; do
            [ -d "$checkout/.git" ] || continue
            echo "$(basename "$(dirname "$checkout")") $(git -C "$checkout" rev-parse HEAD 2>/dev/null || echo unknown)"
          done

      # ==========================================
      # Save haxelib cache
      # ==========================================
      # Saving uses the exact key that was looked up, so a restore-key warm-up
      # uploads the current content once and later runs hit it exactly. PRs
      # only read the shared entry (their cache scope is unreachable from main
      # anyway); main and a manual/release dispatch write it.
      - name: Save haxelib and hxcpp tools
        id: haxelib-save
        if: success() && github.event_name != 'pull_request' && steps.target-selection.outputs.enabled == 'true' && steps.haxelib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HAXELIB_PATH }}
          key: ${{ env.CACHE_SCHEMA }}-haxelib-${{ matrix.setup }}-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json', 'setup/unix.sh', 'setup/windows.bat', 'setup/windows-msvc-fix.ps1') }}

      # ==========================================
      # Save the Gradle dependency cache - Android
      # ==========================================
      - name: Save Gradle cache
        if: success() && github.event_name != 'pull_request' && steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.gradle-home.outputs.dir }}/caches
          key: ${{ env.CACHE_SCHEMA }}-gradle-${{ matrix.cache_name }}-${{ runner.os }}-${{ hashFiles('hmm.json', 'setup/unix.sh', 'source/android/media3/build.gradle') }}-${{ inputs.buildFlags != '' && format('explicit-{0}', inputs.buildFlags) || 'unset' }}

      # ==========================================
      # Restore hxcpp's content-addressed C++ cache
      # ==========================================
      # The key only describes things that make the *batch* of objects
      # incompatible: toolchain, target, pinned dependencies and the build
      # flags. It deliberately does not hash the source tree, project.hxp or
      # the workflow file:
      #   * every commit touches source files, and hashing them produced one
      #     ~140-370 MB snapshot per commit, which is what filled the quota;
      #   * hxcpp hashes each translation unit's own inputs and falls back to
      #     a real compile when they changed, so a shared cache is safe;
      #   * the previous scheme also mixed a UTC day into the key while saving
      #     only on a miss, so a sparse commit cadence could skip saving
      #     entirely and the "warm" restore was never reused.
      # `cache-primary-key` is therefore always the restore key, which turns
      # this into a rolling cache: a miss restores the previous generation,
      # adds the new objects and re-saves the same key after the build.
      - name: Restore hxcpp object cache
        id: build-cache
        if: steps.target-selection.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          # Regenerate Lime/Haxe outputs from the current source and assets;
          # only reuse objects through hxcpp's own dependency/flag hashes.
          path: ${{ env.HXCPP_COMPILE_CACHE }}
          key: ${{ env.CACHE_SCHEMA }}-hxcpp-${{ matrix.cache_name }}-${{ runner.os }}-${{ runner.arch }}-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json', 'setup/unix.sh', 'setup/windows.bat', 'setup/windows-msvc-fix.ps1') }}-${{ inputs.buildFlags != '' && format('explicit-{0}', inputs.buildFlags) || 'unset' }}
          restore-keys: |
            ${{ env.CACHE_SCHEMA }}-hxcpp-${{ matrix.cache_name }}-${{ runner.os }}-${{ runner.arch }}-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json', 'setup/unix.sh', 'setup/windows.bat', 'setup/windows-msvc-fix.ps1') }}-${{ inputs.buildFlags != '' && format('explicit-{0}', inputs.buildFlags) || 'unset' }}

      # ==========================================
      # Compile Windows
      # ==========================================
      - name: Compile (Windows)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.setup == 'windows'
        shell: pwsh
        # Limiting parallel C++ compilation keeps Windows runners below their memory limit.
        env:
          HXCPP_COMPILE_THREADS: 4
          BUILD_FLAGS: ${{ inputs.buildFlags }}
        run: |
          Remove-Item -Force assets/preload/gameRenders/renderlinux.sh

          $buildFlag = if ($env:BUILD_FLAGS) { $env:BUILD_FLAGS } else { 'commit' }
          $buildArgs = @('run', 'lime', 'build', 'windows', "-D$buildFlag")
          # PR/push CI builds drop the built-in weeks and story songs (keeping
          # the tutorial + bundled mods) to keep the artifact .zip small.
          # Explicit workflow_dispatch / workflow_call flags are left untouched.
          if ('${{ github.event_name }}' -eq 'push' -or '${{ github.event_name }}' -eq 'pull_request') {
            $buildArgs += '-DNO_BUILTIN_CONTENT'
          }
          # LTCG adds substantial link time. Keep it for official releases,
          # while routine CI uses the same fast link as local builds.
          if ($buildFlag -eq 'officialBuild') {
            $buildArgs += '-DHXCPP_OPTIMIZE_LINK'
          }
          & haxelib @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ==========================================
      # Compile Android
      # ==========================================
      - name: Compile (Android)
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        env:
          HXCPP_COMPILE_THREADS: 4
          BUILD_FLAGS: ${{ inputs.buildFlags }}
        run: |
          args=()
          if [ -n "$BUILD_FLAGS" ]; then
            args+=("-D$BUILD_FLAGS")
          fi
          # PR/push CI builds drop the built-in weeks and story songs (keeping
          # the tutorial + bundled mods) to keep the artifact .zip small.
          case "${{ github.event_name }}" in
            push|pull_request) args+=("-DNO_BUILTIN_CONTENT") ;;
          esac
          haxelib run lime build android "${args[@]}"

      # ==========================================
      # Verify the actual merged Android manifest
      # ==========================================
      - name: Verify Android Media3/SAF manifest and SDK levels
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          set -euo pipefail
          app_dir="build/release/android/bin/app"
          merged_manifest=$(find "$app_dir/build/intermediates" -type f -name AndroidManifest.xml \
            \( -path '*/merged_manifest/*' -o -path '*/merged_manifests/*' \) \
            -path '*/debug/*' -print -quit)
          if [ -z "$merged_manifest" ]; then
            echo "::error::Could not find the merged debug AndroidManifest.xml under $app_dir/build/intermediates"
            find "$app_dir/build/intermediates" -type f -name AndroidManifest.xml -print
            exit 1
          fi
          python3 tools/check_android_documents_manifest.py "$merged_manifest" \
            --provider present --media-service present --minimum-sdk 21 --target-sdk 36

      # ==========================================
      # Verify the APK ships the NDK C++ runtime
      # ==========================================
      # liblime.so is linked against the shared C++ runtime, so the APK must
      # contain lib/<abi>/libc++_shared.so next to it or the app dies on launch
      # with "dlopen failed: library libc++_shared.so not found".
      - name: Verify Android APK native libs
        if: steps.target-selection.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          set -euo pipefail

          apk=$(ls build/release/android/bin/app/build/outputs/apk/*/*.apk | head -n 1)
          echo "Checking native libraries in $apk"

          entries=$(unzip -Z1 "$apk" | grep -E '^lib/[^/]+/[^/]+$' || true)
          echo "$entries"

          if [ -z "$entries" ]; then
            echo "::error::$apk contains no native libraries at all"
            exit 1
          fi

          missing=0
          for abi in $(printf '%s\n' "$entries" | cut -d/ -f2 | sort -u); do
            if ! printf '%s\n' "$entries" | grep -qxF "lib/$abi/libc++_shared.so"; then
              echo "::error::$apk is missing lib/$abi/libc++_shared.so, so liblime.so cannot be loaded at runtime"
              missing=1
            fi
          done

          [ "$missing" -eq 0 ]

      # ==========================================
      # Save the updated object cache
      # ==========================================
      # Same key as the restore above, so the refreshed snapshot replaces the
      # restored generation instead of adding another entry. Saving from
      # failed builds would risk caching objects from a partially compiled
      # tree, and PRs only read it (a PR cache scope is not even visible to
      # main). The save reuses the key that was actually looked up rather than
      # relying on `cache-primary-key` being reported on a missed lookup.
      - name: Save hxcpp object cache
        id: build-cache-save
        if: success() && github.event_name != 'pull_request' && steps.target-selection.outputs.enabled == 'true' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HXCPP_COMPILE_CACHE }}
          key: ${{ env.CACHE_SCHEMA }}-hxcpp-${{ matrix.cache_name }}-${{ runner.os }}-${{ runner.arch }}-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json', 'setup/unix.sh', 'setup/windows.bat', 'setup/windows-msvc-fix.ps1') }}-${{ inputs.buildFlags != '' && format('explicit-{0}', inputs.buildFlags) || 'unset' }}

      # ==========================================
      # Publish artifact
      # ==========================================
      - name: Publish artifact
        if: steps.target-selection.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
