; Phoenix Engine runtime configuration.
; This file is optional. Runtime values do not add features excluded at compile time.
; Keys use INI sections; booleans accept true/false, yes/no, on/off, and 1/0.

[editors]
enabled = true

[transitions]
enabled = true

[warnings]
beta = true

[scripts]
; Optional global data/states script name (without extension), for example default.
defaultState =
; true prints every step of Lua script loading ([LuaDiag] lines in the console and vlog).
; Same as Options -> Misc -> Verbose Lua Logging. See docs/LUA_SCRIPT_DEBUGGING.md.
verboseLua = false

[graphics]
; auto selects the platform default. Supported explicit values: 120, 330, 300 es.
glslVersion = auto

[urls]
repository = https://github.com/havaianasdestruido/FNF-Phoenix-Engine
releases = https://github.com/havaianasdestruido/FNF-Phoenix-Engine/releases
releasesApi = https://api.github.com/repos/havaianasdestruido/FNF-Phoenix-Engine/releases?per_page=100
issues = https://github.com/havaianasdestruido/FNF-Phoenix-Engine/issues

[window]
; Empty title uses the shipped windowTitleBase.txt string.
title =
; Relative to the game working directory. Empty keeps the platform default icon.
icon =

[features]
; Additional runtime-only toggles can be queried through RuntimeFlags.getBool().
